[package]
name = "japanese-numeral-normalize-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "WebAssembly (JavaScript) bindings for japanese-numeral-normalize"
repository = "https://github.com/masayasviel/japanese-numeral-normalize"

[lib]
# cdylib: .wasm を作る / rlib: tests/ から Rust の関数として呼ぶ
crate-type = ["cdylib", "rlib"]

# wasm-bindgen は、クレートと CLI（wasm-bindgen / wasm-bindgen-test-runner）のバージョンが
# 完全に一致していないと動かない。Cargo.lock はコミットしないので `=` で固定する。
# 上げるときは compose.yaml の wasm-bindgen-cli（WASM_BINDGEN_VERSION）も合わせて上げる。
# js-sys / wasm-bindgen-test は、この wasm-bindgen に対応するバージョン。
[dependencies]
japanese-numeral-normalize = { path = ".." }
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
