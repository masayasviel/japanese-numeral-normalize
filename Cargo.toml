[package]
name = "japanese-numeral-normalize"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Convert between Arabic numerals and Japanese kanji numerals"
repository = "https://github.com/masayasviel/japanese-numeral-normalize"
readme = "README.md"

[dependencies]

[lints]
workspace = true

# 本体（このクレート）と WASM バインディング（wasm/）のワークスペース。
# 本体は依存なし・no_std のまま保ち、wasm-bindgen への依存は wasm/ に閉じ込める。
[workspace]
members = ["wasm"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
