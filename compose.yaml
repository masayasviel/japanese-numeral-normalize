# テスト・ビルド用の Rust 環境の定義。手元に Rust を入れなくてよい。
# 実行するコマンドは Makefile にまとめている（make lint / make test / make build）。
#
# 公式の Rust イメージをそのまま使うので Dockerfile は書かない。
# ソースは .:/app でマウントするので、編集してもイメージを作り直さなくてよい。
# ビルド結果（target/）は named volume に置く。消すときは `docker compose down -v`。

services:
  app:
    image: rust:1.97-slim
    working_dir: /app
    volumes:
      - .:/app
      - target:/app/target

volumes:
  target:
