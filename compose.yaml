# Docker だけでテスト・ビルドするための設定。手元に Rust を入れなくてよい。
#
#   docker compose run --rm check                    # fmt / clippy / test をまとめて実行
#   docker compose run --rm msrv                     # MSRV（Rust 1.85）でテスト
#   docker compose run --rm dev cargo test           # 好きな cargo コマンドを実行
#   docker compose run --rm dev cargo build --release
#   docker compose run --rm dev cargo fmt            # 整形（ソースを書き換える）
#   docker compose run --rm dev                      # コンテナのシェルに入る
#
# ビルド結果（target/）は named volume に置く。消すときは `docker compose down -v`。

# stable 環境の共通設定。`x-` で始まるキーは Compose に無視されるので、
# YAML のアンカー（&）で定義して各サービスで `<<: *rust-stable` と展開する。
x-rust-stable: &rust-stable
  build:
    context: .
    args:
      RUST_VERSION: "1.97"
  image: japanese-numeral-normalize:rust-1.97
  volumes:
    - .:/app
    - target-stable:/app/target

services:
  dev:
    <<: *rust-stable
    command: bash

  check:
    <<: *rust-stable
    command:
      - sh
      - -c
      - |
        set -e
        cargo fmt --all --check
        cargo clippy --all-targets -- -D warnings
        cargo test

  # Cargo.toml の rust-version と同じバージョンでビルド・テストできることを確認する
  msrv:
    build:
      context: .
      args:
        RUST_VERSION: "1.85"
    image: japanese-numeral-normalize:rust-1.85
    volumes:
      - .:/app
      - target-msrv:/app/target
    command: cargo test

volumes:
  target-stable:
  target-msrv:
